[package]
name = "hex-editor-bevy"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = "0.15.*"
bevy_egui = "0.33.*"
bevy_panorbit_camera = { version = "0.23.*", features = ["bevy_egui"] }
ciborium = "0.2.*"
egui_file = "0.22.*"
hexx = { version = "0.20.*", features = ["algorithms", "grid", "mesh", "bevy_reflect", "serde"] }
serde = { version = "1.0.*", features = ["derive"]}
#serde_json = "1.0.140"
